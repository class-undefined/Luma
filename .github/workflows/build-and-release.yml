name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version, e.g. 0.2.1 or 0.3.0-rc.1'
        required: false
        type: string
      publish:
        description: 'Create a Release if this version has not been published'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and package universal DMG
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      artifact: ${{ steps.metadata.outputs.artifact }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve package version
        id: metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: ./scripts/ci-release-plan.sh

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Test release event planning
        run: python3 scripts/test-release-plan.py

      - name: Test core behavior
        run: swift test

      - name: Set up optional Developer ID signing
        if: github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/ci-signing.sh

      - name: Compile, package and verify DMG
        env:
          LUMA_VERSION: ${{ steps.metadata.outputs.version }}
          LUMA_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-dmg.sh

      - name: Upload DMG and SHA-256 checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.metadata.outputs.artifact }}
          path: |
            build/Luma-*.dmg
            build/Luma-*.dmg.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove temporary signing credentials
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/luma-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/luma-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/luma-signing.p12"

  publish:
    name: Publish GitHub Release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Verify downloaded checksum
        working-directory: dist
        run: sha256sum --check ./*.sha256

      - name: Create release or update its assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          assets=(dist/*.dmg dist/*.sha256)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            args=(--target "$RELEASE_SHA" --title "Luma $RELEASE_VERSION" --generate-notes)
            if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${args[@]}"
          fi
